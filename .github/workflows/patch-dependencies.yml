name: 🤖 Agentic Dependency Patching

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Run every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'

  # Allow a human to kick it off at any time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (detect updates but do not write files or open PRs)'
        type: boolean
        default: false

# ─── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write        # push the update branch
  pull-requests: write   # open the PR
  issues: write          # open a Copilot issue on build failure

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  patch:
    name: Detect & Apply Updates
    runs-on: ubuntu-latest

    outputs:
      packages_changed: ${{ steps.update.outputs.packages_changed }}
      sdk_changed:      ${{ steps.update.outputs.sdk_changed }}
      update_summary:   ${{ steps.update.outputs.update_summary }}
      new_sdk_version:  ${{ steps.update.outputs.new_sdk_version }}
      branch_name:      ${{ steps.branch.outputs.name }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT so that the push later can trigger downstream workflows
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── .NET SDK ────────────────────────────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Always use the latest .NET 10 patch release
          dotnet-version: '10.0.x'

      # ── Run the update script ───────────────────────────────────────────────
      - name: Apply dependency updates
        id: update
        shell: pwsh
        run: |
          $dryRun = '${{ github.event.inputs.dry_run }}' -eq 'true'
          $flag   = if ($dryRun) { '-DryRun' } else { '' }
          & ./scripts/Update-Dependencies.ps1 @($flag ? '-DryRun' : @())

      # ── Resolve branch name ─────────────────────────────────────────────────
      - name: Resolve update branch name
        id: branch
        shell: pwsh
        run: |
          $date   = Get-Date -Format 'yyyyMMdd'
          $branch = "deps/auto-update-$date"
          "name=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Restore NuGet packages
        if: steps.update.outputs.packages_changed == 'true' || steps.update.outputs.sdk_changed == 'true'
        run: dotnet restore Mcp.sln

      - name: Build solution
        id: build
        if: steps.update.outputs.packages_changed == 'true' || steps.update.outputs.sdk_changed == 'true'
        run: dotnet build Mcp.sln --no-restore --configuration Release
        continue-on-error: true

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run tests
        id: test
        if: steps.build.outcome == 'success'
        run: dotnet test Mcp.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      # ── Upload test results ─────────────────────────────────────────────────
      - name: Upload test results
        if: steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      # ── Capture build errors for the Copilot issue ──────────────────────────
      - name: Capture build error log
        id: build_errors
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $log = dotnet build Mcp.sln --no-restore --configuration Release 2>&1 |
                 Where-Object { $_ -match 'error|Error' } |
                 Select-Object -First 60 |
                 Out-String
          # Write as multiline output
          $delim = [Guid]::NewGuid().ToString('N')
          "build_log<<$delim"  | Out-File $env:GITHUB_OUTPUT -Append
          $log                 | Out-File $env:GITHUB_OUTPUT -Append
          $delim               | Out-File $env:GITHUB_OUTPUT -Append

      # ── Open Copilot issue on build failure ─────────────────────────────────
      - name: Open issue and assign to GitHub Copilot (breaking changes)
        if: steps.build.outcome == 'failure' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.update.outputs.update_summary }}`;
            const buildLog = `${{ steps.build_errors.outputs.build_log }}`;

            const body = [
              '## 🔴 Automated dependency update – build failure',
              '',
              'The weekly dependency update workflow bumped the packages below, but the',
              'build now fails. @github-copilot please fix the breaking changes.',
              '',
              '### Updated packages',
              summary,
              '',
              '### Build errors',
              '```',
              buildLog,
              '```',
              '',
              '### Instructions for Copilot',
              '1. Fix any API breaking changes introduced by the package updates listed above.',
              '2. Prefer minimal, surgical changes – do not refactor unrelated code.',
              '3. Keep all existing tests passing.',
              '4. Commit the fixes and create a pull request targeting `main`.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `fix: resolve breaking changes from dependency update (${ new Date().toISOString().slice(0,10) })`,
              body,
              labels: ['dependencies', 'breaking-change', 'copilot'],
              assignees: ['copilot'],
            });

            core.notice(`Copilot issue opened: ${issue.html_url}`);

      # ── Commit changes and open a PR (success path) ─────────────────────────
      - name: Create pull request
        if: >
          steps.build.outcome == 'success' &&
          (steps.update.outputs.packages_changed == 'true' || steps.update.outputs.sdk_changed == 'true') &&
          github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: |
            chore: auto-update dependencies (${{ steps.branch.outputs.name }})

            Updated via the agentic patch workflow.
          title: '🤖 chore: auto-update dependencies'
          body: |
            ## Automated dependency update

            This pull request was opened automatically by the **Agentic Dependency Patching** workflow.

            ### Package changes

            ${{ steps.update.outputs.update_summary }}

            ### .NET SDK
            SDK version in CI workflow files updated to `${{ steps.update.outputs.new_sdk_version }}`: ${{ steps.update.outputs.sdk_changed }}

            ### Validation
            | Step | Result |
            |------|--------|
            | Build | ✅ passed |
            | Tests | ${{ steps.test.outcome == 'success' && '✅ passed' || steps.test.outcome == 'skipped' && '⏭ no test projects found' || '⚠️ failed (see artifacts)' }} |

            > **Note:** If any MCP API surfaces changed, review the MCP package release notes before merging.
          labels: |
            dependencies
            automated
          delete-branch: true

      # ── No-op message when nothing changed ──────────────────────────────────
      - name: Report – nothing to update
        if: steps.update.outputs.packages_changed != 'true' && steps.update.outputs.sdk_changed != 'true'
        run: echo "✅ All packages and SDK references are already up to date."
