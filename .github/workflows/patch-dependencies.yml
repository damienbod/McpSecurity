name: 🤖 Agentic Dependency Patching

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Run every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'

  # Allow a human to kick it off at any time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run – detect updates and print them, but do not open an issue'
        type: boolean
        default: false

# ─── Permissions ─────────────────────────────────────────────────────────────
permissions:
  issues: write   # open the Copilot coding-agent issue

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  detect-and-delegate:
    name: Detect outdated packages and delegate to Copilot
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── .NET SDK ────────────────────────────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Detect outdated packages ─────────────────────────────────────────────
      # dotnet list package --outdated --include-prerelease shows ALL available
      # versions including next-major previews (e.g. .NET 11 previews).
      # We capture the raw output and pass it to the Copilot issue so the agent
      # can make informed decisions about which versions to target.
      - name: Detect outdated packages
        id: detect
        run: |
          OUTDATED=$(dotnet list Mcp.sln package --outdated --include-prerelease 2>&1 || true)
          echo "outdated<<EOF_OUTDATED" >> "$GITHUB_OUTPUT"
          echo "$OUTDATED"             >> "$GITHUB_OUTPUT"
          echo "EOF_OUTDATED"          >> "$GITHUB_OUTPUT"

          # has_updates = true when at least one line starts with whitespace + '>'
          if echo "$OUTDATED" | grep -qE '^\s+>'; then
            echo "has_updates=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Nothing to do ────────────────────────────────────────────────────────
      - name: Nothing to update
        if: steps.detect.outputs.has_updates != 'true'
        run: echo "✅ All packages are already up to date – no issue opened."

      # ── Skip due to dry-run ───────────────────────────────────────────────────
      - name: Dry-run – show detected updates without opening an issue
        if: steps.detect.outputs.has_updates == 'true' && inputs.dry_run == true
        run: |
          echo "🔍 Dry-run mode – the following updates were detected:"
          echo "${{ steps.detect.outputs.outdated }}"

      # ── Check for an existing open update issue ───────────────────────────────
      # Avoid opening a duplicate if last week's issue is still open.
      - name: Check for existing open update issue
        id: existing
        if: steps.detect.outputs.has_updates == 'true' && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'dependencies,automated',
              per_page: 10,
            });
            const existing = issues.find(i => i.title.startsWith('chore: update dependencies'));
            if (existing) {
              core.notice(`Open update issue already exists: ${existing.html_url} – skipping.`);
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
            }

      # ── Open Copilot coding-agent issue ──────────────────────────────────────
      - name: Open issue assigned to GitHub Copilot
        if: >
          steps.detect.outputs.has_updates == 'true' &&
          inputs.dry_run != true &&
          steps.existing.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const outdated = `${{ steps.detect.outputs.outdated }}`;
            const date     = new Date().toISOString().slice(0, 10);

            const body = [
              '## 🤖 Automated dependency update request',
              '',
              'This issue was opened automatically by the weekly dependency patching workflow.',
              '@github-copilot please carry out **all** of the steps below and open a pull request when done.',
              '',
              '---',
              '',
              '## Outdated packages detected',
              '```',
              outdated,
              '```',
              '',
              '---',
              '',
              '## Step-by-step instructions',
              '',
              '### 1 — Update NuGet packages',
              '',
              'Install the `dotnet-outdated-tool` and run it with `--pre-release Auto`:',
              '```bash',
              'dotnet tool install --global dotnet-outdated-tool',
              'dotnet outdated Mcp.sln --upgrade --pre-release Auto',
              '```',
              '',
              '**`--pre-release Auto` rules (follow these strictly):**',
              '- A package currently on a **prerelease** version → upgrade to the **latest prerelease** of the *same major*.',
              '- A package currently on a **stable** version → upgrade to the **latest stable** only.',
              '- **Never** bump a package to a higher major version than the one already in use.',
              '  For example, if `Microsoft.Extensions.*` is on `10.x` and the latest is `11.0.0-preview.*`,',
              '  do **not** upgrade to `11.x`. Stay on the latest `10.x` stable release.',
              '',
              '### 2 — Fix any breaking changes',
              '',
              '- Run `dotnet build Mcp.sln --configuration Release` after updating.',
              '- If the build fails, inspect the errors and fix **only** the code broken by the package updates.',
              '- Make minimal, surgical changes — do not refactor unrelated code.',
              '- Pay special attention to `ModelContextProtocol` and `ModelContextProtocol.AspNetCore`:',
              '  the MCP SDK has moved from `0.x` preview to `1.x` stable and may have breaking API changes.',
              '',
              '### 3 — Update the .NET SDK version in CI workflow files',
              '',
              '- Run `dotnet --version` to get the installed SDK version (e.g. `10.0.201`).',
              '- Open every `.github/workflows/*.yml` file.',
              '- If any file pins an **older patch** of the same major.minor (e.g. `10.0.100` while `10.0.201` is current),',
              '  update it. Leave wildcard entries like `10.0.x` unchanged.',
              '- Do **not** change the major.minor (e.g. do not switch from `10.0.x` to `11.0.x`).',
              '',
              '### 4 — Run tests',
              '',
              '```bash',
              'dotnet test Mcp.sln --no-build --configuration Release',
              '```',
              '',
              'Fix any test failures caused by the updated packages.',
              '',
              '### 5 — Open a pull request',
              '',
              `- Branch name: \`deps/auto-update-${date}\``,
              '- Target: `main`',
              `- Title: \`chore: update dependencies (${date})\``,
              '- PR body must include a markdown table of every package that changed (old → new version).',
              '- Add the labels `dependencies` and `automated` to the PR.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner:     context.repo.owner,
              repo:      context.repo.repo,
              title:     `chore: update dependencies (${date})`,
              body,
              labels:    ['dependencies', 'automated'],
              assignees: ['copilot'],
            });

            core.notice(`✅ Copilot coding-agent issue opened: ${issue.html_url}`);
